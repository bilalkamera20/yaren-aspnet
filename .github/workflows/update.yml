name: nernur liste

on:
  workflow_dispatch:
  schedule:
    - cron: '30 01 * * *'   # UTC 01:30 → TSi 04:30

jobs:
  update_files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: .NET SDK Kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: C# Uygulamasını Derle ve Çalıştır
        run: dotnet run --configuration Release

      - name: Değişiklikleri Kaydet ve Yükle
        env:
          TZ: Europe/Istanbul
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -f nernur.txt ]; then
            git add nernur.txt
          fi

          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atılmadı."
          else
            git commit -m "Otomatik Güncelleme (C#): $(date +'%d.%m.%Y %H:%M')"
            BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
            git push origin $BRANCH_NAME
          fi
